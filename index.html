<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AnimeStream</title>
  <link rel="icon" href="/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000; --surface: #111113; --surface2: #18181b;
      --border: rgba(255,255,255,0.1); --primary: #22c55e;
      --text: #fafafa; --muted: #a1a1aa;
      --nav-h: 64px; --pad: clamp(16px, 4vw, 56px);
      --card-w: clamp(118px, 28vw, 168px); --radius: 14px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Geist', 'Inter', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; min-height: 100dvh;
      -webkit-font-smoothing: antialiased; overflow-x: hidden;
    }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; touch-action: manipulation; }
    img { display: block; max-width: 100%; }

    .topnav-wrap {
      position: fixed; top: 12px; left: 0; right: 0; z-index: 50;
      display: flex; justify-content: center; padding: 0 12px; pointer-events: none;
    }
    .topnav {
      pointer-events: auto; display: flex; align-items: center; gap: 2px;
      max-width: 100%; padding: 4px 6px 4px 8px; border-radius: 20px;
      background: rgba(255,255,255,0.14);
      backdrop-filter: blur(24px) saturate(1.6);
      -webkit-backdrop-filter: blur(24px) saturate(1.6);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
      overflow-x: auto; scrollbar-width: none;
    }
    .topnav::-webkit-scrollbar { display: none; }
    .brand { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; cursor: pointer; flex-shrink: 0; }
    .brand img { width: 26px; height: 26px; border-radius: 8px; object-fit: cover; }
    .brand span { font-weight: 700; font-size: 0.88rem; white-space: nowrap; }
    .brand span b { color: var(--primary); }
    .nav-link {
      padding: 8px 12px; border-radius: 14px; flex-shrink: 0;
      font-size: 0.84rem; font-weight: 500; color: rgba(255,255,255,0.72); white-space: nowrap;
    }
    .nav-link.active { background: rgba(255,255,255,0.16); color: #fff; font-weight: 600; }
    .nav-ico {
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
      display: grid; place-items: center; color: rgba(255,255,255,0.7);
    }

    .page {
      opacity: 0; transform: translateY(6px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none; position: absolute; inset: 0; width: 100%;
      height: fit-content; min-height: 100vh;
    }
    .page.active { opacity: 1; transform: none; pointer-events: auto; position: relative; }
    .page.hidden-page { display: none; }

    .hero {
      position: relative; height: min(88vh, 900px); min-height: 400px;
      display: flex; align-items: flex-end;
      background: #0a0a0a center/cover no-repeat;
    }
    .hero::before {
      content: ''; position: absolute; inset: 0;
      background:
        linear-gradient(90deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 45%, transparent 75%),
        linear-gradient(0deg, #000 0%, transparent 48%);
    }
    .hero-inner {
      position: relative; z-index: 2;
      padding: 0 var(--pad) clamp(40px, 8vh, 72px);
      max-width: min(560px, 100%); width: 100%;
    }
    .hero-badge { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .hero-badge span {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.12);
      padding: 5px 12px; border-radius: 999px; font-size: 0.78rem; font-weight: 500;
    }
    .hero-title {
      font-size: clamp(1.5rem, 5vw, 3.2rem); font-weight: 800;
      line-height: 1.05; margin-bottom: 12px; letter-spacing: -0.03em;
    }
    .hero-desc {
      color: rgba(255,255,255,0.78); font-size: clamp(0.85rem, 2vw, 0.95rem); line-height: 1.55;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden; margin-bottom: 18px;
    }
    .btn-play {
      display: inline-flex; align-items: center; gap: 8px;
      background: #fff; color: #000; min-height: 44px;
      padding: 12px 24px; border-radius: 999px; font-weight: 700; font-size: 0.95rem;
    }
    .hero-dots {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      z-index: 3; display: flex; gap: 6px;
    }
    .hero-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.3); cursor: pointer; }
    .hero-dot.active { background: #fff; width: 20px; border-radius: 4px; }

    .home-content { padding: 0 0 48px; margin-top: -4px; position: relative; z-index: 2; }
    .section-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px var(--pad) 10px; gap: 12px;
    }
    .section-title { font-size: clamp(1.05rem, 2.5vw, 1.2rem); font-weight: 700; }
    .section-title em { font-style: normal; border-bottom: 2px solid #fff; }
    .section-more { font-size: 0.84rem; color: var(--muted); font-weight: 500; white-space: nowrap; }

    .row-wrap { position: relative; }
    .row {
      display: flex; gap: 12px; overflow-x: auto;
      padding: 4px var(--pad) 16px; scroll-snap-type: x mandatory;
      scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
    }
    .row::-webkit-scrollbar { display: none; }
    .row-arrow {
      position: absolute; top: 40%; transform: translateY(-50%);
      z-index: 5; width: 40px; height: 40px; border-radius: 50%;
      background: rgba(20,20,22,0.9); border: 1px solid rgba(255,255,255,0.12);
      color: #fff; display: none; place-items: center; font-size: 1.2rem;
    }
    @media (hover: hover) and (min-width: 900px) {
      .row-arrow { display: grid; opacity: 0; transition: opacity 0.2s; }
      .row-wrap:hover .row-arrow { opacity: 1; }
    }
    .row-arrow.left { left: 8px; }
    .row-arrow.right { right: 8px; }

    /* Cards — always show title */
    .card { flex: 0 0 var(--card-w); scroll-snap-align: start; cursor: pointer; }
    .card-poster {
      position: relative; border-radius: 12px; overflow: hidden;
      aspect-ratio: 2/3; background: #141416;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
      transition: transform 0.25s ease;
    }
    @media (hover: hover) {
      .card:hover .card-poster { transform: scale(1.04); }
    }
    .card-poster img { width: 100%; height: 100%; object-fit: cover; }
    .card-ph {
      width: 100%; height: 100%; display: grid; place-items: center;
      font-size: 2.2rem; font-weight: 800; color: rgba(255,255,255,0.2);
      background: linear-gradient(160deg, #1c1c26, #0a0a0c);
    }
    .card-type {
      position: absolute; top: 8px; left: 8px;
      background: rgba(0,0,0,0.65); font-size: 0.6rem; font-weight: 700;
      padding: 3px 6px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .card-type.movie { color: #93c5fd; }
    .card-type.tv { color: #c4b5fd; }
    .card-type.anime { color: var(--primary); }
    .card-title {
      margin-top: 8px; font-size: 0.8rem; font-weight: 600; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-sub { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(132px, 42vw), 1fr));
      gap: 16px 12px; padding: 8px var(--pad) 48px;
    }
    .grid .card { flex: none; width: 100%; }

    .browse-bar {
      padding: 0 var(--pad) 8px;
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    }
    .chip {
      padding: 8px 14px; border-radius: 999px; font-size: 0.8rem; font-weight: 600;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      color: var(--muted); min-height: 36px;
    }
    .chip.active { background: #fff; color: #000; border-color: #fff; }

    .page-title {
      padding: calc(var(--nav-h) + 20px) var(--pad) 12px;
      font-size: clamp(1.35rem, 4vw, 1.8rem); font-weight: 800; letter-spacing: -0.03em;
    }
    .state { padding: 48px var(--pad); text-align: center; color: var(--muted); }
    .state.error { color: #f87171; }
    .load-more {
      display: block; margin: 8px auto 32px; padding: 12px 28px;
      border-radius: 999px; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12); font-weight: 600; font-size: 0.9rem;
      min-height: 44px;
    }
    .load-more:hover { background: rgba(255,255,255,0.14); }
    .load-more:disabled { opacity: 0.55; }
    .hidden { display: none !important; }

    .search-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.94); backdrop-filter: blur(20px);
      display: none; flex-direction: column; align-items: center;
      padding: max(72px, env(safe-area-inset-top)) 16px 24px;
    }
    .search-overlay.show { display: flex; }
    .search-box { width: 100%; max-width: 560px; position: relative; }
    .search-box input {
      width: 100%; height: 52px; border-radius: 999px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14);
      padding: 0 18px 0 48px; font-size: 16px; color: #fff; outline: none;
    }
    .search-box svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    .search-close {
      position: absolute; top: max(16px, env(safe-area-inset-top)); right: 16px;
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.08); color: var(--muted); font-size: 1.15rem;
    }
    .search-hint { width: 100%; max-width: 560px; margin-top: 10px; font-size: 0.78rem; color: var(--muted); text-align: center; }
    .search-tabs {
      display: flex; gap: 8px; margin: 16px 0 12px; max-width: 560px; width: 100%;
      overflow-x: auto; scrollbar-width: none;
    }
    .search-tabs::-webkit-scrollbar { display: none; }
    .search-tab {
      padding: 8px 14px; border-radius: 999px; font-size: 0.84rem; font-weight: 600;
      background: rgba(255,255,255,0.06); color: var(--muted);
      border: 1px solid rgba(255,255,255,0.1); white-space: nowrap; flex-shrink: 0;
    }
    .search-tab.active { background: rgba(255,255,255,0.14); color: #fff; border-color: transparent; }
    .search-results {
      width: 100%; max-width: 1000px; overflow-y: auto; flex: 1;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(min(120px, 40vw), 1fr));
      gap: 14px 10px; padding: 8px 0 32px;
    }

    .player-shell {
      padding: calc(var(--nav-h) + 16px) var(--pad) 48px;
      max-width: 1400px; margin: 0 auto; width: 100%;
    }
    .back-btn {
      display: inline-flex; align-items: center; gap: 8px;
      color: #fff; font-size: 0.9rem; margin-bottom: 16px; font-weight: 600;
      min-height: 44px; padding: 10px 18px; border-radius: 999px;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(12px); transition: background 0.2s, transform 0.15s;
    }
    .back-btn:hover, .back-btn:active { background: rgba(255,255,255,0.18); transform: scale(1.02); }
    .player-layout { display: grid; grid-template-columns: 1fr minmax(240px, 300px); gap: 20px; }
    .video-wrap {
      position: relative; background: #000; border-radius: var(--radius);
      overflow: hidden; aspect-ratio: 16/9; box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    }
    .video-wrap > iframe { width: 100%; height: 100%; border: 0; }
    .player-info h1 { font-size: clamp(1.15rem, 3vw, 1.4rem); font-weight: 700; margin: 16px 0 6px; }
    .player-info .meta { color: var(--muted); font-size: 0.88rem; margin-bottom: 12px; }
    .server-row, .lang-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .server-label { width: 100%; font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .lang-btn, .season-btn, .server-btn {
      padding: 8px 14px; border-radius: 10px; font-size: 0.8rem; font-weight: 600;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      color: var(--muted); min-height: 40px;
    }
    .lang-btn.active, .season-btn.active, .server-btn.active {
      background: #fff; color: #000; border-color: #fff;
    }
    .ep-panel {
      background: rgba(255,255,255,0.04); border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.08);
      max-height: min(72vh, 640px); display: flex; flex-direction: column;
    }
    .ep-panel h3 { padding: 14px 16px; font-size: 0.95rem; border-bottom: 1px solid rgba(255,255,255,0.08); font-weight: 700; }
    .ep-list { overflow-y: auto; flex: 1; padding: 8px; -webkit-overflow-scrolling: touch; }
    .ep {
      display: flex; align-items: center; gap: 10px;
      padding: 12px; border-radius: 10px; cursor: pointer; font-size: 0.85rem; min-height: 44px;
    }
    .ep:hover { background: rgba(255,255,255,0.06); }
    .ep.active { background: rgba(255,255,255,0.12); font-weight: 600; }
    .ep-num { font-weight: 700; min-width: 40px; color: var(--muted); }
    .ep.active .ep-num { color: #fff; }

    @media (max-width: 960px) {
      .player-layout { grid-template-columns: 1fr; }
      .ep-panel { max-height: 280px; }
    }
    @media (max-width: 600px) {
      .brand span { display: none; }
      .nav-link { padding: 8px 10px; font-size: 0.78rem; }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="topnav-wrap">
    <nav class="topnav">
      <div class="brand" onclick="goHome()">
        <img src="/logo.jpg" alt="">
        <span>Anime<b>Stream</b></span>
      </div>
      <button class="nav-link active" data-nav="home" onclick="nav('home')">Home</button>
      <button class="nav-link" data-nav="movies" onclick="nav('movies')">Movies</button>
      <button class="nav-link" data-nav="series" onclick="nav('series')">Series</button>
      <button class="nav-link" data-nav="anime" onclick="nav('anime')">Anime</button>
      <button class="nav-ico" onclick="openSearch()" aria-label="Search">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="7" r="5.5"/><path d="M12 12l2.5 2.5"/></svg>
      </button>
    </nav>
  </div>

  <div id="homeView" class="page active">
    <div class="hero" id="hero">
      <div class="hero-inner">
        <div class="hero-badge" id="heroBadge"></div>
        <h1 class="hero-title" id="heroTitle">Loading…</h1>
        <p class="hero-desc" id="heroDesc"></p>
        <button class="btn-play" id="heroPlay">▶ Play</button>
      </div>
      <div class="hero-dots" id="heroDots"></div>
    </div>
    <div class="home-content" id="homeRows"></div>
  </div>

  <div id="browseView" class="page hidden-page">
    <h2 class="page-title" id="browseTitle">Browse</h2>
    <div class="browse-bar" id="browseBar"></div>
    <div class="grid" id="browseGrid"></div>
    <button class="load-more hidden" id="loadMoreBtn" onclick="loadMoreBrowse()">Load more</button>
  </div>

  <div id="playerView" class="page hidden-page">
    <div class="player-shell">
      <button class="back-btn" onclick="appBack()" aria-label="Back">← Back</button>
      <div class="player-layout">
        <div>
          <div class="video-wrap">
            <iframe id="player" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" referrerpolicy="unsafe-url"></iframe>
          </div>
          <div class="player-info">
            <h1 id="mediaTitle"></h1>
            <div class="meta" id="mediaMeta"></div>
            <div class="server-label" id="serverLabel" style="display:none">Servers</div>
            <div class="server-row" id="serverRow"></div>
            <div class="lang-btns" id="playerControls"></div>
          </div>
        </div>
        <div class="ep-panel" id="epPanel">
          <h3 id="epPanelTitle">Episodes</h3>
          <div class="ep-list" id="episodeList"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="search-overlay" id="searchOverlay">
  <button class="search-close" onclick="closeSearch()">✕</button>
  <div class="search-box">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="6"/><path d="M13 13l3 3"/></svg>
    <input id="searchInput" type="search" placeholder="Search all sources…" autocomplete="off" enterkeyhint="search">
  </div>
  <p class="search-hint">Searches Anime · Series · Movies together</p>
  <div class="search-tabs">
    <button class="search-tab active" data-st="all" onclick="setSearchTab('all')">All</button>
    <button class="search-tab" data-st="movie" onclick="setSearchTab('movie')">Movies</button>
    <button class="search-tab" data-st="tv" onclick="setSearchTab('tv')">Series</button>
    <button class="search-tab" data-st="anime" onclick="setSearchTab('anime')">Anime</button>
  </div>
  <div class="search-results" id="searchResults"></div>
</div>

<script>
const ANILIST = 'https://graphql.anilist.co';
const TVMAZE = 'https://api.tvmaze.com';
const CINEMETA = 'https://v3-cinemeta.strem.io';
const $ = id => document.getElementById(id);

const MOVIE_SERVERS = [
  { name: 'VidSrc', url: m => m.embed || `https://vid-src.top/embed/movie/${m.imdb || m.tmdb}` },
  { name: 'VidSrc Link', url: m => `https://vidsrc.link/embed/movie/${m.imdb || m.tmdb}` },
  { name: 'VidSrc PM', url: m => `https://vidsrc.pm/embed/movie/${m.imdb || m.tmdb}` },
  { name: 'Videasy', url: m => `https://player.videasy.to/movie/${m.imdb || m.tmdb}` },
  { name: 'VidSpark', url: m => `https://vidspark.to/movie/${m.imdb || m.tmdb}` },
];
const TV_SERVERS = [
  { name: 'VidSrc', url: (id,s,e) => `https://vid-src.top/embed/tv/${id}/${s}/${e}` },
  { name: 'VidSrc Link', url: (id,s,e) => `https://vidsrc.link/embed/tv/${id}/${s}/${e}` },
  { name: 'VidSrc PM', url: (id,s,e) => `https://vidsrc.pm/embed/tv/${id}/${s}/${e}` },
  { name: 'Videasy', url: (id,s,e) => `https://player.videasy.to/tv/${id}/${s}/${e}` },
  { name: 'VidSpark', url: (id,s,e) => `https://vidspark.to/tv/${id}/${s}/${e}` },
];

const ANIME_SERVERS = [
  { name: 'MegaPlay', url: (m, ep, lang) => {
      const q = new URLSearchParams({ ep: String(ep), lang: lang || 'sub' });
      if (m.mal_id) q.set('mal', String(m.mal_id));
      if (m.ani_id) q.set('ani', String(m.ani_id));
      return `/megaplay.html?${q.toString()}`;
    } },
  { name: 'VidHawk', url: (m, ep, lang) => m.ani_id ? `https://vidhawk.buzz/embed/ani/${m.ani_id}/${ep}/${lang}` : `https://vidhawk.buzz/embed/mal/${m.mal_id}/${ep}/${lang}` },
  { name: 'VidLink', url: (m, ep, lang) => `https://vidlink.pro/anime/${m.mal_id || m.ani_id}/${ep}/${lang}` },
  { name: 'VidSrc', url: (m, ep) => m.tmdb ? `https://vid-src.top/embed/tv/${m.tmdb}/1/${ep}` : `https://vidsrc.sh/embed/anime/${m.mal_id || m.ani_id}/1/${ep}` },
  { name: 'VidSrc PM', url: (m, ep) => m.imdb ? `https://vidsrc.pm/embed/tv/${m.imdb}/1/${ep}` : '' },
  { name: '2Embed', url: (m, ep) => m.imdb ? `https://www.2embed.cc/embedtv/${m.imdb}&s=1&e=${ep}` : '' },
];
const ANIME_GENRES = ['Action','Romance','Comedy','Drama','Fantasy','Horror','Sci-Fi','Slice of Life','Sports','Supernatural','Mystery','Adventure'];
const MOVIE_CATS = ['New','Popular','Action','Comedy','Adventure','Animation','Sci-Fi','Fantasy','Family','Drama'];

let heroItems = [], heroIdx = 0, heroTimer = null;
let current = null, lang = 'sub', season = 1, epIndex = 0, serverIdx = 0;
let searchTab = 'all', searchTimer = null;
let movieCache = [], seriesCache = [];
let browseMode = null, browsePage = 1, browseGenre = null, browseItems = [], browseHasMore = true;
let browseSkip = 0, browseLoading = false;

async function anilist(query, variables = {}) {
  const res = await fetch(ANILIST, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
    body: JSON.stringify({ query, variables })
  });
  const json = await res.json();
  if (json.errors) throw new Error(json.errors[0]?.message || 'AniList error');
  return json.data;
}

const Q_ANIME_TREND = `query($page:Int){Page(page:$page,perPage:24){pageInfo{hasNextPage} media(type:ANIME,sort:TRENDING_DESC,isAdult:false){id idMal title{romaji english} coverImage{large extraLarge} bannerImage averageScore genres episodes seasonYear description(asHtml:false)}}}`;
const Q_ANIME_POP = `query($page:Int){Page(page:$page,perPage:24){pageInfo{hasNextPage} media(type:ANIME,sort:POPULARITY_DESC,isAdult:false){id idMal title{romaji english} coverImage{large} averageScore genres episodes seasonYear}}}`;
const Q_ANIME_GENRE = `query($page:Int,$genre:String){Page(page:$page,perPage:24){pageInfo{hasNextPage} media(type:ANIME,genre:$genre,sort:POPULARITY_DESC,isAdult:false){id idMal title{romaji english} coverImage{large} averageScore genres episodes seasonYear}}}`;
const Q_ANIME_SEARCH = `query($q:String){Page(page:1,perPage:30){media(type:ANIME,search:$q,isAdult:false,sort:SEARCH_MATCH){id idMal title{romaji english} coverImage{large} averageScore genres episodes seasonYear}}}`;
const Q_ANIME_INFO = `query($id:Int){Media(id:$id,type:ANIME){id idMal title{romaji english} episodes averageScore genres seasonYear description(asHtml:false) coverImage{large} bannerImage}}`;

function titleOf(m) { return m.title?.english || m.title?.romaji || m.title || m.name || 'Untitled'; }
function stripHtml(s) { return (s || '').replace(/<[^>]+>/g, '').replace(/\n+/g, ' ').trim(); }
function esc(s) { return String(s || '').replace(/`/g, "'").replace(/\\/g, ''); }

/* Proxy through our Vercel API to avoid CORS */
async function fetchMovies(page = 1) {
  const res = await fetch(`/api/movies?page=${page}`);
  if (!res.ok) throw new Error('Movies API ' + res.status);
  const data = await res.json();
  const items = (data.result || []).map(m => {
    const imdb = m.imdb_id || '';
    const tmdb = m.tmdb_id || '';
    return {
      _type: 'movie', id: imdb || tmdb, imdb, tmdb,
      _title: (m.title || 'Movie').replace(/\s+\d{4}$/, ''),
      _poster: m.poster || (imdb ? `https://images.metahub.space/poster/medium/${imdb}/img` : ''),
      _backdrop: m.backdrop || (imdb ? `https://images.metahub.space/background/medium/${imdb}/img` : ''),
      _sub: m.quality || 'Movie', _src: 'VidSrc',
      embed: (m.embed_url || '').replace(/^http:\/\//, 'https://')
    };
  });
  items._pages = Number(data.pages) || 0;
  return items;
}
function mapCinemetaMovie(m) {
  const imdb = m.imdb_id || (String(m.id || '').startsWith('tt') ? m.id : '');
  const year = m.year || String(m.released || '').slice(0, 4);
  return {
    _type: 'movie', id: imdb, imdb, tmdb: m.moviedb_id || '',
    _title: m.name || 'Movie',
    _poster: imdb ? `https://images.metahub.space/poster/medium/${imdb}/img` : (m.poster || ''),
    _backdrop: imdb ? `https://images.metahub.space/background/medium/${imdb}/img` : (m.background || ''),
    _sub: [year, m.imdbRating ? `★ ${m.imdbRating}` : '', (m.genre || []).slice(0, 2).join(', ')].filter(Boolean).join(' · '),
    _src: 'Cinemeta',
    embed: imdb ? `https://vid-src.top/embed/movie/${imdb}` : '',
    summary: m.description || ''
  };
}
async function fetchCinemetaMovies(extra = '') {
  const path = extra
    ? `${CINEMETA}/catalog/movie/top/${extra}.json`
    : `${CINEMETA}/catalog/movie/top.json`;
  const res = await fetch(path);
  if (!res.ok) throw new Error('Movie catalog ' + res.status);
  const data = await res.json();
  return (data.metas || []).map(mapCinemetaMovie).filter(m => m.imdb);
}
async function fetchVidTv(page = 1) {
  const res = await fetch(`/api/tv?page=${page}`);
  if (!res.ok) throw new Error('TV API ' + res.status);
  const data = await res.json();
  return (data.result || []).map(m => ({
    _type: 'tv', id: m.tmdb_id || m.imdb_id, imdb: m.imdb_id, tmdb: m.tmdb_id,
    _title: m.title, _poster: '', _sub: 'Series', _src: 'VidSrc'
  }));
}
async function fetchTvmazePopular() {
  const pages = await Promise.all([0, 1, 2].map(p =>
    fetch(`${TVMAZE}/shows?page=${p}`).then(r => r.json()).catch(() => [])
  ));
  const all = pages.flat();
  all.sort((a, b) => (b.rating?.average || 0) - (a.rating?.average || 0));
  return all.filter(s => s.externals?.imdb).slice(0, 60).map(mapTvmaze);
}
async function searchTvmaze(q) {
  const res = await fetch(`${TVMAZE}/search/shows?q=${encodeURIComponent(q)}`);
  return (await res.json()).map(x => mapTvmaze(x.show)).filter(s => s.imdb);
}
function mapTvmaze(s) {
  return {
    _type: 'tv', id: s.id, imdb: s.externals?.imdb, tvmaze: s.id,
    _title: s.name, _poster: s.image?.original || s.image?.medium || '',
    _sub: [(s.premiered || '').slice(0, 4), s.rating?.average ? `★ ${s.rating.average}` : '', (s.genres || []).slice(0, 2).join(', ')].filter(Boolean).join(' · '),
    _src: 'TVmaze', summary: stripHtml(s.summary), premiered: s.premiered
  };
}
function mapAnime(m) {
  return {
    ...m, _type: 'anime', _title: titleOf(m),
    _poster: m.coverImage?.large || m.coverImage?.extraLarge,
    _sub: [m.seasonYear, m.averageScore ? `★ ${(m.averageScore/10).toFixed(1)}` : '', (m.genres||[]).slice(0,2).join(', ')].filter(Boolean).join(' · '),
    _src: 'AniList'
  };
}

function posterSrc(item) {
  if (item._poster) return item._poster;
  if (item.imdb && String(item.imdb).startsWith('tt')) {
    return `https://images.metahub.space/poster/medium/${item.imdb}/img`;
  }
  if (item._type === 'movie' && item.tmdb) return `/api/poster?tmdb=${encodeURIComponent(item.tmdb)}`;
  return '';
}
function cardHTML(item) {
  const type = item._type, title = item._title, sub = item._sub || '';
  const poster = posterSrc(item);
  let onclick = '';
  if (type === 'anime') onclick = `openAnime(${item.id},${item.idMal||0},\`${esc(title)}\`,${item.episodes||12})`;
  else if (type === 'movie') onclick = `openMovie(\`${esc(item.tmdb||item.id)}\`,\`${esc(item.imdb||'')}\`,\`${esc(title)}\`)`;
  else onclick = `openTv(\`${esc(item.imdb||'')}\`,\`${esc(String(item.tvmaze||item.id))}\`,\`${esc(title)}\`)`;
  const letter = (title || '?')[0].toUpperCase();
  const img = poster
    ? `<img src="${poster}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">` +
      `<div class="card-ph" style="display:none">${letter}</div>`
    : `<div class="card-ph">${letter}</div>`;
  return `<div class="card" onclick="${onclick}" role="button" tabindex="0">
    <div class="card-poster">
      ${img}
      <span class="card-type ${type}">${type === 'tv' ? 'series' : type}</span>
    </div>
    <div class="card-title">${title}</div>
    <div class="card-sub">${sub}</div>
  </div>`;
}
function rowHTML(titleHtml, items, moreMode, rowId, moreGenre) {
  if (!items?.length) return '';
  const id = rowId || ('row' + Math.random().toString(36).slice(2, 8));
  const more = moreMode
    ? `<button class="section-more" onclick="nav('${moreMode}'${moreGenre ? `,'${moreGenre}'` : ''})">View All ›</button>`
    : '';
  return `<section class="section">
    <div class="section-head">
      <h2 class="section-title">${titleHtml}</h2>
      ${more}
    </div>
    <div class="row-wrap">
      <button class="row-arrow left" onclick="scrollRow('${id}',-1)">‹</button>
      <div class="row" id="${id}">${items.map(cardHTML).join('')}</div>
      <button class="row-arrow right" onclick="scrollRow('${id}',1)">›</button>
    </div>
  </section>`;
}
function scrollRow(id, dir) {
  const el = document.getElementById(id);
  if (el) el.scrollBy({ left: dir * Math.min(el.clientWidth * 0.8, 600), behavior: 'smooth' });
}

function setNav(mode) {
  document.querySelectorAll('.nav-link').forEach(el => el.classList.toggle('active', el.dataset.nav === mode));
}
function showPage(id) {
  ['homeView', 'browseView', 'playerView'].forEach(pid => {
    const el = $(pid);
    if (pid === id) {
      el.classList.remove('hidden-page');
      requestAnimationFrame(() => el.classList.add('active'));
    } else {
      el.classList.remove('active');
      setTimeout(() => { if (!el.classList.contains('active')) el.classList.add('hidden-page'); }, 280);
    }
  });
  if (id !== 'playerView') $('player').src = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* In-app history. Each screen is a history entry, and a guard entry is
   pushed again on Back so the browser cannot leave the site. */
let applyingHistory = false;
const histStack = [{ kind: 'home' }];

function seedHistory() {
  const state = { app: 1, i: 0 };
  history.replaceState(state, '', location.href);
  history.pushState(state, '', location.href);
}
function pushHist(entry) {
  if (applyingHistory) return;
  histStack.push(entry);
  history.pushState({ app: 1, i: histStack.length - 1 }, '', location.href);
}
function rearmHistory() {
  history.pushState({ app: 1, i: Math.max(0, histStack.length - 1) }, '', location.href);
}
function applyHist(entry) {
  applyingHistory = true;
  try {
    if (!entry || entry.kind === 'home') {
      browseMode = null;
      browseGenre = null;
      setNav('home');
      closeSearch();
      showPage('homeView');
    } else if (entry.kind === 'browse') {
      nav(entry.mode, entry.genre, true);
    } else if (entry.kind === 'player') {
      if (entry.playerType === 'movie') openMovie(entry.tmdb, entry.imdb, entry.title, true);
      else if (entry.playerType === 'tv') openTv(entry.imdb, entry.tvmaze, entry.title, true);
      else openAnime(entry.aniId, entry.malId, entry.title, entry.episodes, true);
    }
  } finally {
    applyingHistory = false;
  }
}
window.addEventListener('popstate', () => {
  if ($('searchOverlay')?.classList.contains('show')) {
    closeSearch();
    rearmHistory();
    return;
  }
  if (histStack.length > 1) histStack.pop();
  applyHist(histStack[histStack.length - 1]);
  rearmHistory();
});
function appBack() {
  history.back();
}
function goHome() { nav('home'); }
function nav(mode, genre, silent) {
  setNav(mode === 'genre' ? 'anime' : mode);
  closeSearch();
  if (!silent) {
    if (mode === 'home') pushHist({ kind: 'home' });
    else pushHist({ kind: 'browse', mode, genre: genre || (mode === 'movies' ? 'New' : null) });
  }
  if (mode === 'home') { browseMode = null; browseGenre = null; showPage('homeView'); return; }
  showPage('browseView');
  browseMode = mode;
  browseGenre = genre || (mode === 'movies' ? 'New' : null);
  browsePage = 1;
  browseSkip = 0;
  browseItems = [];
  browseHasMore = true;
  const titles = {
    movies: browseGenre && browseGenre !== 'New' ? `${browseGenre} Movies` : 'Movies',
    series: 'Series', anime: 'Anime',
    genre: genre ? `${genre} Anime` : 'Anime'
  };
  $('browseTitle').textContent = titles[mode] || mode;
  $('browseBar').innerHTML = '';
  if (mode === 'anime' || mode === 'genre') {
    $('browseBar').innerHTML = ANIME_GENRES.map(g =>
      `<button class="chip ${browseGenre === g ? 'active' : ''}" onclick="nav('genre','${g}')">${g}</button>`
    ).join('');
  } else if (mode === 'movies') {
    $('browseBar').innerHTML = MOVIE_CATS.map(g =>
      `<button class="chip ${browseGenre === g ? 'active' : ''}" onclick="nav('movies','${g}')">${g}</button>`
    ).join('');
  }
  $('browseGrid').innerHTML = '<div class="state">Loading…</div>';
  $('loadMoreBtn').classList.add('hidden');
  loadBrowse(true);
}

async function loadHome() {
  $('homeRows').innerHTML = '<div class="state">Loading…</div>';
  const [animeTrend, animePop, moviesNew, moviesPop, movAction, movComedy, movAni, movAdv, series, romance, action, comedy] = await Promise.all([
    anilist(Q_ANIME_TREND, { page: 1 }).then(d => (d.Page.media || []).map(mapAnime)).catch(() => []),
    anilist(Q_ANIME_POP, { page: 1 }).then(d => (d.Page.media || []).map(mapAnime)).catch(() => []),
    fetchMovies(1).catch(e => { console.warn(e); return []; }),
    fetchCinemetaMovies().catch(() => []),
    fetchCinemetaMovies('genre=Action').catch(() => []),
    fetchCinemetaMovies('genre=Comedy').catch(() => []),
    fetchCinemetaMovies('genre=Animation').catch(() => []),
    fetchCinemetaMovies('genre=Adventure').catch(() => []),
    fetchTvmazePopular().catch(() => []),
    anilist(Q_ANIME_GENRE, { page: 1, genre: 'Romance' }).then(d => (d.Page.media || []).map(mapAnime)).catch(() => []),
    anilist(Q_ANIME_GENRE, { page: 1, genre: 'Action' }).then(d => (d.Page.media || []).map(mapAnime)).catch(() => []),
    anilist(Q_ANIME_GENRE, { page: 1, genre: 'Comedy' }).then(d => (d.Page.media || []).map(mapAnime)).catch(() => []),
  ]);
  movieCache = moviesNew;
  seriesCache = series;

  heroItems = [
    ...moviesPop.slice(0, 4).map(m => ({
      type: 'movie', tmdb: m.tmdb, imdb: m.imdb, title: m._title,
      backdrop: m._backdrop || m._poster, desc: m.summary || 'Pick another server below the player if the first one is blank', score: null, year: ''
    })),
    ...series.slice(0, 3).map(s => ({
      type: 'tv', imdb: s.imdb, tvmaze: s.tvmaze, title: s._title,
      backdrop: s._poster, desc: s.summary, score: null, year: (s.premiered || '').slice(0, 4)
    })),
    ...animeTrend.slice(0, 3).map(m => ({
      type: 'anime', id: m.id, mal: m.idMal, title: m._title,
      backdrop: m.bannerImage || m._poster, desc: stripHtml(m.description),

    }))
  ].filter(h => h.title);

  renderHero(0);
  startHeroRotate();

  let html = '';
  if (moviesNew.length) html += rowHTML('New <em>Movies</em>', moviesNew.slice(0, 24), 'movies', 'rowMovies', 'New');
  if (moviesPop.length) html += rowHTML('Popular <em>Movies</em>', moviesPop.slice(0, 24), 'movies', 'rowMoviesPop', 'Popular');
  if (movAction.length) html += rowHTML('Action <em>Movies</em>', movAction.slice(0, 24), 'movies', 'rowMovAction', 'Action');
  if (movComedy.length) html += rowHTML('Comedy <em>Movies</em>', movComedy.slice(0, 24), 'movies', 'rowMovComedy', 'Comedy');
  if (movAni.length) html += rowHTML('Animation <em>Movies</em>', movAni.slice(0, 24), 'movies', 'rowMovAni', 'Animation');
  if (movAdv.length) html += rowHTML('Adventure <em>Movies</em>', movAdv.slice(0, 24), 'movies', 'rowMovAdv', 'Adventure');
  if (series.length) html += rowHTML('Trending Series <em>This Week</em>', series.slice(0, 24), 'series', 'rowSeries');
  if (animeTrend.length) html += rowHTML('Trending <em>Anime</em>', animeTrend, 'anime', 'rowAnime');
  if (action.length) html += rowHTML('Action <em>Anime</em>', action, 'anime', 'rowAction');
  if (romance.length) html += rowHTML('Romance <em>Anime</em>', romance, 'anime', 'rowRomance');
  if (comedy.length) html += rowHTML('Comedy <em>Anime</em>', comedy, 'anime', 'rowComedy');
  if (animePop.length) html += rowHTML('Popular <em>Anime</em>', animePop, 'anime', 'rowAnimePop');

function renderHero(i) {
  if (!heroItems.length) return;
  heroIdx = ((i % heroItems.length) + heroItems.length) % heroItems.length;
  const h = heroItems[heroIdx];
  if (h.backdrop) $('hero').style.backgroundImage = `url(${h.backdrop})`;
  else $('hero').style.backgroundImage = 'linear-gradient(135deg,#0f2918 0%,#000 70%)';
  $('heroTitle').textContent = h.title;
  $('heroDesc').textContent = h.desc || '';
  const badges = [];
  if (h.score) badges.push(`★ ${Number(h.score).toFixed(1)}`);
  if (h.year) badges.push(String(h.year));
  badges.push(h.type === 'anime' ? 'Anime' : h.type === 'tv' ? 'Series' : 'Movie');
  $('heroBadge').innerHTML = badges.map(b => `<span>${b}</span>`).join('');
  $('heroPlay').onclick = () => {
    if (h.type === 'anime') openAnime(h.id, h.mal, h.title, h.episodes);
    else if (h.type === 'movie') openMovie(h.tmdb, h.imdb, h.title);
    else openTv(h.imdb, h.tvmaze, h.title);
  };
  $('heroDots').innerHTML = heroItems.map((_, idx) =>
    `<div class="hero-dot ${idx === heroIdx ? 'active' : ''}" onclick="renderHero(${idx});startHeroRotate()"></div>`
  ).join('');
}

function startHeroRotate() {
  clearInterval(heroTimer);
  if (heroItems.length < 2) return;
  heroTimer = setInterval(() => renderHero(heroIdx + 1), 7000);
}

/* Hero swipe (touch + mouse drag) */
(function setupHeroSwipe() {
  const el = () => $('hero');
  let startX = 0, startY = 0, tracking = false;
  function onStart(x, y) { startX = x; startY = y; tracking = true; }
  function onEnd(x, y) {
    if (!tracking) return;
    tracking = false;
    const dx = x - startX, dy = y - startY;
    if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;
    if (dx < 0) renderHero(heroIdx + 1);
    else renderHero(heroIdx - 1);
    startHeroRotate();
  }
  document.addEventListener('DOMContentLoaded', () => {});
  // bind when hero exists
  setTimeout(() => {
    const h = el();
    if (!h) return;
    h.addEventListener('touchstart', e => onStart(e.changedTouches[0].clientX, e.changedTouches[0].clientY), { passive: true });
    h.addEventListener('touchend', e => onEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY), { passive: true });
    h.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') onStart(e.clientX, e.clientY); });
    h.addEventListener('pointerup', e => { if (e.pointerType === 'mouse') onEnd(e.clientX, e.clientY); });
  }, 0);
})();


async function loadBrowse(reset) {
  if (browseLoading) return;
  browseLoading = true;
  $('loadMoreBtn').disabled = true;
  try {
    let batch = [], hasMore = false;
    if (browseMode === 'anime' || browseMode === 'genre') {
      const q = browseGenre ? Q_ANIME_GENRE : Q_ANIME_POP;
      const vars = browseGenre ? { page: browsePage, genre: browseGenre } : { page: browsePage };
      const d = await anilist(q, vars);
      batch = (d.Page.media || []).map(mapAnime);
      hasMore = !!d.Page.pageInfo?.hasNextPage;
    } else if (browseMode === 'movies') {
      const cat = browseGenre || 'New';
      if (cat === 'New') {
        batch = await fetchMovies(browsePage);
        const pages = batch._pages || 5;
        hasMore = batch.length > 0 && browsePage < pages;
      } else {
        const extra = cat === 'Popular'
          ? (browseSkip ? `skip=${browseSkip}` : '')
          : `genre=${encodeURIComponent(cat)}&skip=${browseSkip}`;
        batch = await fetchCinemetaMovies(extra);
        hasMore = batch.length >= 40;
      }
    } else if (browseMode === 'series') {
      if (browsePage === 1) {
        batch = seriesCache.length ? seriesCache : await fetchTvmazePopular();
        seriesCache = batch;
      }
      hasMore = false;
    }
    if (reset) browseItems = batch;
    else browseItems = browseItems.concat(batch);
    browseHasMore = hasMore;
    const seen = new Set();
    browseItems = browseItems.filter(it => {
      const k = it._type + ':' + (it.id || it.imdb || it._title);
      if (seen.has(k)) return false;
      seen.add(k); return true;
    });
    $('browseGrid').innerHTML = browseItems.length
      ? browseItems.map(cardHTML).join('')
      : '<div class="state">No results</div>';
    $('loadMoreBtn').classList.toggle('hidden', !browseHasMore);
    $('loadMoreBtn').textContent = 'Load more';
  } catch (e) {
    $('browseGrid').innerHTML = `<div class="state error">${e.message}</div>`;
    $('loadMoreBtn').classList.add('hidden');
  } finally {
    browseLoading = false;
    $('loadMoreBtn').disabled = false;
  }
}
function loadMoreBrowse() {
  if (browseLoading || !browseHasMore) return;
  if (browseMode === 'movies' && browseGenre && browseGenre !== 'New') browseSkip += 50;
  else browsePage += 1;
  loadBrowse(false);
}

function openSearch() {
  // Match search tab to current section
  let tab = 'all';
  if (browseMode === 'movies') tab = 'movie';
  else if (browseMode === 'series') tab = 'tv';
  else if (browseMode === 'anime' || browseMode === 'genre') tab = 'anime';
  setSearchTab(tab);
  $('searchOverlay').classList.add('show');
  $('searchInput').focus();
}
function closeSearch() {
  $('searchOverlay').classList.remove('show');
  $('searchInput').value = '';
  $('searchResults').innerHTML = '';
}
function setSearchTab(t) {
  searchTab = t;
  document.querySelectorAll('.search-tab').forEach(el => el.classList.toggle('active', el.dataset.st === t));
  const q = $('searchInput').value.trim();
  if (q.length > 1) runSearch(q);
}
$('searchInput').addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = $('searchInput').value.trim();
  if (q.length < 2) { $('searchResults').innerHTML = ''; return; }
  searchTimer = setTimeout(() => runSearch(q), 320);
});
$('searchInput').addEventListener('keydown', e => { if (e.key === 'Escape') closeSearch(); });

async function runSearch(q) {
  $('searchResults').innerHTML = '<div class="state">Searching all sources…</div>';
  const tasks = [];
  if (searchTab === 'all' || searchTab === 'anime') {
    tasks.push(anilist(Q_ANIME_SEARCH, { q }).then(d => (d.Page.media || []).map(mapAnime)).catch(() => []));
  } else tasks.push(Promise.resolve([]));
  if (searchTab === 'all' || searchTab === 'tv') {
    tasks.push(searchTvmaze(q).catch(() => []));
  } else tasks.push(Promise.resolve([]));
  if (searchTab === 'all' || searchTab === 'movie') {
    tasks.push((async () => {
      const found = await fetchCinemetaMovies(`search=${encodeURIComponent(q)}`).catch(() => []);
      const ql = q.toLowerCase();
      const local = movieCache.filter(m => (m._title || '').toLowerCase().includes(ql));
      return [...found, ...local];
    })());
  } else tasks.push(Promise.resolve([]));

  const [anime, series, movies] = await Promise.all(tasks);
  const items = [...anime, ...series, ...movies];
  const seen = new Set();
  const unique = [];
  for (const it of items) {
    const k = it._type + ':' + (it._title || '').toLowerCase();
    if (seen.has(k)) continue;
    seen.add(k); unique.push(it);
  }
  $('searchResults').innerHTML = unique.length ? unique.map(cardHTML).join('') : '<div class="state">No results</div>';
}

function showPlayer() { setNav(''); closeSearch(); showPage('playerView'); }
function playNow(url) {
  if (!url) return;
  const player = $('player');
  player.referrerPolicy = 'unsafe-url';
  player.src = url.replace(/^http:\/\//, 'https://');
}

function renderServers(list) {
  if (!list || list.length < 2) {
    $('serverLabel').style.display = 'none';
    $('serverRow').innerHTML = '';
    return;
  }
  $('serverLabel').style.display = 'block';
  $('serverRow').innerHTML = list.map((s, i) =>
    `<button class="server-btn ${i === serverIdx ? 'active' : ''}" onclick="setServer(${i})">${s.name}</button>`
  ).join('');
}
function setServer(i) {
  serverIdx = i;
  document.querySelectorAll('.server-btn').forEach((el, idx) => el.classList.toggle('active', idx === i));
  if (!current) return;
  if (current.type === 'movie') loadMovieServer();
  else if (current.type === 'tv') loadTvServer();
  else if (current.type === 'anime') playAnime(epIndex);
}

function openMovie(tmdb, imdb, title, silent) {
  if (!silent) pushHist({ kind: 'player', playerType: 'movie', tmdb, imdb, title });
  closeSearch(); showPlayer();
  const id = imdb || tmdb;
  current = { type: 'movie', tmdb, imdb, id, title, embed: '' };
  const cached = movieCache.find(m => (imdb && m.imdb === imdb) || (tmdb && m.tmdb === tmdb));
  if (cached?.embed) current.embed = cached.embed;
  serverIdx = 0;
  $('mediaTitle').textContent = title;
  $('mediaMeta').textContent = 'Movie · if the player is blank, tap another server';
  $('epPanel').style.display = 'none';
  $('playerControls').innerHTML = '';
  renderServers(MOVIE_SERVERS);
  loadMovieServer();
}
function loadMovieServer() {
  const srv = MOVIE_SERVERS[serverIdx] || MOVIE_SERVERS[0];
  const url = srv.url(current);
  if (!url || url.endsWith('/undefined') || url.endsWith('/')) {
    $('mediaMeta').textContent = 'No playable id for this title';
    return;
  }
  playNow(url);
}

async function openTv(imdb, tvmazeId, title, silent) {
  if (!silent) pushHist({ kind: 'player', playerType: 'tv', imdb, tvmaze: tvmazeId, title });
  closeSearch(); showPlayer();
  current = { type: 'tv', imdb, tvmaze: tvmazeId, id: imdb, title, seasons: {}, seasonList: [] };
  season = 1; epIndex = 0; serverIdx = 0;
  $('mediaTitle').textContent = title;
  $('mediaMeta').textContent = 'Loading…';
  $('epPanel').style.display = '';
  $('playerControls').innerHTML = '';
  renderServers(TV_SERVERS);

  if (tvmazeId && String(tvmazeId).match(/^\d+$/)) {
    try {
      const eps = await fetch(`${TVMAZE}/shows/${tvmazeId}/episodes`).then(r => r.json());
      const bySeason = {};
      for (const e of eps) {
        if (!e.season || !e.number) continue;
        if (!bySeason[e.season]) bySeason[e.season] = [];
        bySeason[e.season].push(e);
      }
      current.seasons = bySeason;
      current.seasonList = Object.keys(bySeason).map(Number).sort((a, b) => a - b);
      season = current.seasonList[0] || 1;
      $('mediaMeta').textContent = `${current.seasonList.length} season${current.seasonList.length > 1 ? 's' : ''} · ${eps.length} episodes`;
      $('playerControls').innerHTML = current.seasonList.slice(0, 24).map(s =>
        `<button class="season-btn ${s === season ? 'active' : ''}" onclick="setSeason(${s})">S${s}</button>`
      ).join('');
      renderTvEps(); loadTvServer(); return;
    } catch (e) { $('mediaMeta').textContent = e.message; }
  }
  current.seasons = { 1: Array.from({ length: 12 }, (_, i) => ({ number: i + 1, name: `Episode ${i + 1}` })) };
  current.seasonList = [1]; season = 1;
  $('mediaMeta').textContent = 'Series';
  renderTvEps(); loadTvServer();
}
function setSeason(s) {
  season = s;
  document.querySelectorAll('.season-btn').forEach(el => el.classList.toggle('active', el.textContent === `S${s}`));
  epIndex = 0; renderTvEps(); loadTvServer();
}
function renderTvEps() {
  const list = current.seasons[season] || [];
  $('episodeList').innerHTML = list.map((e, i) => {
    const num = e.number || i + 1;
    return `<div class="ep ${i === epIndex ? 'active' : ''}" onclick="playTv(${i})"><span class="ep-num">E${num}</span><span>${e.name || 'Episode ' + num}</span></div>`;
  }).join('') || '<div class="state">No episodes</div>';
}
function playTv(i) {
  epIndex = i;
  document.querySelectorAll('.ep').forEach((el, idx) => el.classList.toggle('active', idx === i));
  loadTvServer();
}
function loadTvServer() {
  if (!current || current.type !== 'tv') return;
  const list = current.seasons[season] || [];
  const num = list[epIndex]?.number || epIndex + 1;
  const id = current.imdb || current.tmdb || current.id;
  if (!id) return alert('No stream ID');
  const srv = TV_SERVERS[serverIdx] || TV_SERVERS[0];
  playNow(srv.url(id, season, num));
}

async function openAnime(aniId, malId, title, episodes, silent) {
  if (!silent) pushHist({ kind: 'player', playerType: 'anime', aniId, malId, title, episodes });
  closeSearch(); showPlayer();
  serverIdx = 0;
  $('mediaTitle').textContent = title;
  $('mediaMeta').textContent = 'Loading…';
  $('epPanel').style.display = '';
  lang = 'sub'; epIndex = 0;
  current = { type: 'anime', ani_id: aniId, mal_id: malId, imdb: '', tmdb: '', title, episodes: episodes || 12 };
  $('playerControls').innerHTML = `<button class="lang-btn active" id="btnSub" onclick="setLang('sub')">SUB</button>
    <button class="lang-btn" id="btnDub" onclick="setLang('dub')">DUB</button>`;
  renderServers(ANIME_SERVERS);
  try {
    const [info, map] = await Promise.all([
      anilist(Q_ANIME_INFO, { id: aniId }).catch(() => null),
      fetch(`https://api.ani.zip/mappings?anilist_id=${aniId}`).then(r => r.ok ? r.json() : null).catch(() => null)
    ]);
    const m = info?.Media;
    const maps = map?.mappings || {};
    current = {
      type: 'anime',
      ani_id: m?.id || aniId,
      mal_id: m?.idMal || maps.mal_id || malId,
      imdb: maps.imdb_id || '',
      tmdb: maps.themoviedb_id || '',
      title: m ? titleOf(m) : title,
      episodes: m?.episodes || map?.episodeCount || episodes || 24
    };
    let n = current.episodes; if (!n || n < 1) n = 12; if (n > 2000) n = 2000;
    current.episodes = n;
    $('mediaTitle').textContent = current.title;
    $('mediaMeta').textContent = [m?.seasonYear, m?.averageScore ? `★ ${(m.averageScore/10).toFixed(1)}` : '', (m?.genres||[]).slice(0,4).join(', '), n + ' eps'].filter(Boolean).join(' · ') + ' · if the player is blank, tap another server';
  } catch (e) {
    $('mediaMeta').textContent = (current.episodes || 12) + ' episodes · if the player is blank, tap another server';
  }
  renderAnimeEps();
  playAnime(0);
}
function renderAnimeEps() {
  const n = current.episodes || 12;
  let html = '';
  for (let i = 0; i < n; i++) {
    html += `<div class="ep ${i===epIndex?'active':''}" onclick="playAnime(${i})"><span class="ep-num">Ep ${i+1}</span><span>Episode ${i+1}</span></div>`;
  }
  $('episodeList').innerHTML = html;
}
function playAnime(i) {
  if (!current || current.type !== 'anime') return;
  epIndex = i;
  document.querySelectorAll('.ep').forEach((el, idx) => el.classList.toggle('active', idx === i));
  const ep = i + 1;
  const srv = ANIME_SERVERS[serverIdx] || ANIME_SERVERS[0];
  const url = srv.url(current, ep, lang);
  if (!url) {
    $('mediaMeta').textContent = 'This server has no id for this title. Tap another server.';
    return;
  }
  playNow(url);
}
function setLang(l) {
  lang = l;
  $('btnSub')?.classList.toggle('active', l === 'sub');
  $('btnDub')?.classList.toggle('active', l === 'dub');
  playAnime(epIndex);
}

// Fix genre View All — open genre browse
document.addEventListener('click', e => {
  const more = e.target.closest('.section-more');
  if (!more) return;
  // handled by onclick
});

loadHome();
seedHistory();
</script>
