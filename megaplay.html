<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="unsafe-url">
  <title>Player</title>
  <style>
    html, body, iframe { margin: 0; width: 100%; height: 100%; border: 0; background: #000; }
    iframe { display: block; }
  </style>
</head>
<body>
  <!-- Pop-up shield (MegaPlay edition, rehoused).
       Their page is served through our own /mgpx/* proxy (see server3.js locally; /api route in
       production). The proxy strips lib/app.main.js, which is the ONLY script that:
         - runs the "sandboxed iframe" probe that shows their big Opss! banner
         - loads their ad engine (nekostream 1ad.js/3p.js -> llvpn.com popunder tag)
       The remaining player (jwplayer + handle-bridge + e1-player) runs untouched, so Skip intro,
       tap-to-see-options, quality menu and next episode still work.
       With app.main.js gone, the sandbox hardens again with no false positives:
         allow-scripts + allow-same-origin + allow-forms + allow-presentation
         (no allow-popups / no allow-top-navigation / no allow-modals). -->
  <iframe id="p" allow="autoplay; fullscreen; encrypted-media; picture-in-picture; screen-wake-lock" allowfullscreen referrerpolicy="unsafe-url"
          sandbox="allow-scripts allow-same-origin allow-forms allow-presentation"></iframe>
  <script>
    // Where the mirrored MegaPlay lives:
    //  - local dev (server3.js): '/mgpx'                       (same origin as this page)
    //  - production Cloudflare worker: 'https://<your-worker>.workers.dev/mgpx'
    //    (see CLOUDFLARE-SETUP.md — deploy megaplay-worker.js once, then paste its URL here)
    // Primary: the Cloudflare Worker (free, keeps video bytes off Vercel).
    // Fallback: the same proxy on this site (api/mgpx.js). If MegaPlay answers the Worker with its
    // 404 page, the mirrored page reports "mp-miss" and we switch to the fallback for this and later plays.
    const PRIMARY_BASE = 'https://soft-cell-f315.sammy12dop.workers.dev/mgpx';
    const FALLBACK_BASE = PRIMARY_BASE;
    let useFallback = false;
    try { useFallback = localStorage.getItem('mp.useFallback') === '1'; } catch (_) {}
    let WORKER_BASE = useFallback ? FALLBACK_BASE : PRIMARY_BASE;
    const q = new URLSearchParams(location.search);
    const lang = q.get('lang') === 'dub' ? 'dub' : 'sub';
    const ep = q.get('ep') || '1';
    const mal = (q.get('mal') || '').replace(/[^\d]/g, '');
    const ani = (q.get('ani') || '').replace(/[^\d]/g, '');
    const embed = (q.get('embed') || '').replace(/[^\d]/g, '');
    const t = Math.max(0, Math.floor(+q.get('t') || 0));
    let src = '';
    let generic = '';
    // Generic mode: any whitelisted embed URL rides the same shield (movies / series / cartoons).
    generic = String(q.get('src') || '')
      .replace(/^https?:\/\//i, 'https://')
      .replace(/[^\w.\/:?=&%~+-]/g, '');
    const GENERIC_OK = /^https:\/\/[a-z0-9.-]*\b(vidspark\.to|vidsrc\.link|vidsrc\.pm|player\.videasy\.to|vid-src\.top|vidsrc\.sh)\//i;
    if (generic && GENERIC_OK.test(generic)) src = generic;
    const buildSrc = base =>
      embed ? base + '/stream/s-2/' + embed + '/' + lang
      : mal ? base + '/stream/mal/' + mal + '/' + ep + '/' + lang
      : ani ? base + '/stream/ani/' + ani + '/' + ep + '/' + lang : '';
    if (!src) src = buildSrc(WORKER_BASE);
    const f = document.getElementById('p');
    if (src) f.src = src;

    // Watchdog: the mirrored (stripped) page has no jump-outs, but defense in depth costs nothing:
    // if any future bundle ever navigates this frame to an unrecognised origin, put the stream back.
    // location.origin is readable cross-origin, so this works even when the mirror lives on another
    // host (Cloudflare worker). Generic embeds may legitimately repoint themselves, so they are exempt.
    // Progress survives: a restore costs seconds, not episodes.
    let EXPECTED = '';
    try { EXPECTED = new URL(src, location.href).origin; } catch (_) { EXPECTED = location.origin; }
    const bootTime = Date.now();
    let lastRestore = 0;
    f.addEventListener('load', () => {
      if (!src || generic) return;                          // generic embeds may legitimately repoint themselves
      if (Date.now() - bootTime < 2500) return;             // the initial embed page load itself
      const now = Date.now();
      if (now - lastRestore < 15000) return;                // no restore loops
      let onOrigin = true;
      try { onOrigin = f.contentWindow.location.origin === EXPECTED; } catch (_) { onOrigin = false; }
      if (onOrigin) return;
      lastRestore = now;
      console.warn('[shield] player was swapped for an unexpected page; restoring the stream');
      try { f.src = src; } catch (_) {}
    });

    // Pass the player's own messages (episode finished, progress) up to the site so it can auto-play the next episode.
    window.addEventListener('message', function (e) {
      if (e.source === f.contentWindow) {
        // Worker got MegaPlay's 404 page: retry once through this site's own proxy instead of telling the app.
        if (e.data && e.data.type === 'mp-miss' && !generic && !useFallback && WORKER_BASE !== FALLBACK_BASE) {
          useFallback = true; WORKER_BASE = FALLBACK_BASE;
          try { localStorage.setItem('mp.useFallback', '1'); } catch (_) {}
          src = buildSrc(WORKER_BASE);
          try { EXPECTED = new URL(src, location.href).origin; } catch (_) { EXPECTED = location.origin; }
          lastRestore = Date.now();
          f.src = src;
          return;
        }
        try { parent.postMessage(e.data, '*'); } catch (_) {}
      }
    });

    // Optional resume: ?t=<seconds> seeks their player once it reports ready (their handle-bridge
    // accepts {event:"seek"} from the parent). The site uses this to restore our own saved position.
    if (t > 0) {
      let seeked = false;
      window.addEventListener('message', function h(e) {
        if (e.source !== f.contentWindow || seeked) return;
        const s = typeof e.data === 'string' ? e.data : '';
        if (s.indexOf('PLAYER_READY') >= 0) {
          seeked = true;
          setTimeout(function () {
            try { f.contentWindow.postMessage({ event: 'seek', time: t }, '*'); } catch (_) {}
          }, 1200);
        }
      });
      setTimeout(function () { if (!seeked) { try { f.contentWindow.postMessage({ event: 'seek', time: t }, '*'); } catch (_) {} } }, 8000);
    }
  </script>
</body>
</html>
