<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="unsafe-url">
  <title>Player</title>
  <style>
    html, body, iframe { margin: 0; width: 100%; height: 100%; border: 0; background: #000; }
    iframe { display: block; }
    #shieldNote { position: fixed; left: 0; right: 0; bottom: 12%; text-align: center; color: #eee;
      font: 14px/1.5 system-ui, sans-serif; text-shadow: 0 1px 3px #000; opacity: 0; transition: opacity .4s; pointer-events: none; }
    #shieldNote.show { opacity: .95; }
  </style>
</head>
<body>
  <!-- MegaPlay is served from the separate Vercel project origin through /mgpx.
       MegaPlay rejects sandboxed iframes, so only its iframe is loaded without sandbox.
       Other generic embed providers retain the restrictive sandbox. -->
  <iframe id="p" allow="autoplay; fullscreen; encrypted-media; picture-in-picture; screen-wake-lock" allowfullscreen referrerpolicy="unsafe-url"></iframe>
  <div id="shieldNote"></div>
  <script>
    // Keep the proxy on the Vercel deployment origin, separate from www.amstream.site.
    // Local server3.js still works directly during development.
    const PROXY_BASE = (/^http:/.test(location.protocol) && /(^|\.)localhost$|^127\.0\.0\.1$|^192\.168\./.test(location.hostname))
      ? location.origin
      : 'https://amstreamm.vercel.app';
    const q = new URLSearchParams(location.search);
    const lang = q.get('lang') === 'dub' ? 'dub' : 'sub';
    const ep = q.get('ep') || '1';
    const mal = (q.get('mal') || '').replace(/[^\d]/g, '');
    const ani = (q.get('ani') || '').replace(/[^\d]/g, '');
    const embed = (q.get('embed') || '').replace(/[^\d]/g, '');
    const t = Math.max(0, Math.floor(+q.get('t') || 0));
    function mirrorSubPath() {                       // the mirrored player page, under /mgpx
      if (embed) return '/mgpx/stream/s-2/' + embed + '/' + lang;
      if (mal) return '/mgpx/stream/mal/' + mal + '/' + ep + '/' + lang;
      if (ani) return '/mgpx/stream/ani/' + ani + '/' + ep + '/' + lang;
      return '';
    }
    // Generic mode: any whitelisted embed URL rides the same shield (movies / series / cartoons).
    const generic = String(q.get('src') || '')
      .replace(/^https?:\/\//i, 'https://')
      .replace(/[^\w.\/:?=&%~+-]/g, '');
    const GENERIC_OK = /^https:\/\/[a-z0-9.-]*\b(vidspark\.to|vidsrc\.link|vidsrc\.pm|player\.videasy\.to|vid-src\.top|vidsrc\.sh)\//i;
    const mpPath = mirrorSubPath();
    const isMegaPlay = !!mpPath;
    let src = '';
    if (generic && GENERIC_OK.test(generic)) src = generic;
    else if (isMegaPlay) src = PROXY_BASE + mpPath;
    const f = document.getElementById('p');
    // MegaPlay explicitly rejects any iframe sandbox attribute. Preserve the
    // existing sandbox for generic non-MegaPlay embed providers.
    if (isMegaPlay) f.removeAttribute('sandbox');
    else f.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-presentation');
    if (src) f.src = src;

    // ---- Liveness watchdog (cross-origin safe) ----
    // A failed swap-out usually leaves a silent loaded frame. A genuine mirror page always
    // speaks soon after boot (fullscreen bridge message; playing-time events while running).
    // A silent load -> reload once. Still silent -> show an honest note + report mp-miss upward
    // so the player page can offer another server instead of looping black.
    let loadGen = 0, spokeNow = false;
    const note = document.getElementById('shieldNote');
    function flashNote(text) {
      note.textContent = text;
      note.classList.add('show');
      setTimeout(() => note.classList.remove('show'), 5000);
    }
    window.addEventListener('message', function (e) {
      if (e.source !== f.contentWindow) return;
      spokeNow = true;
      if (!src) return;
      try { parent.postMessage(e.data, '*'); } catch (_) {}
    });
    f.addEventListener('load', function () {
      if (!src || generic) return;
      spokeNow = false;
      const g = ++loadGen;
      setTimeout(function () {
        if (g !== loadGen || spokeNow) return;       // healthy boot, or a newer load took over
        console.warn('[shield] stream page went silent (likely swapped); reloading the stream');
        try { f.src = src; } catch (_) {}
        // second chance: watch this reload too; if it also stays silent, stop trying
        const g2 = ++loadGen;
        setTimeout(function () {
          if (g2 !== loadGen || spokeNow) return;
          flashNote('This stream won\'t stay embedded in your browser. Try another server or a different browser.');
          try { parent.postMessage({ type: 'mp-miss' }, '*'); } catch (_) {}
        }, 12000);
      }, 12000);
    });

    // Optional resume: ?t=<seconds> seeks their player once it reports ready (their handle-bridge
    // accepts {event:"seek"} from the parent). The site uses this to restore our own saved position.
    if (t > 0) {
      let seeked = false;
      window.addEventListener('message', function h(e) {
        if (e.source !== f.contentWindow || seeked) return;
        const s = typeof e.data === 'string' ? e.data : '';
        if (s.indexOf('PLAYER_READY') >= 0) {
          seeked = true;
          setTimeout(function () {
            try { f.contentWindow.postMessage({ event: 'seek', time: t }, '*'); } catch (_) {}
          }, 1200);
        }
      });
      setTimeout(function () { if (!seeked) { try { f.contentWindow.postMessage({ event: 'seek', time: t }, '*'); } catch (_) {} } }, 8000);
    }
  </script>
</body>
</html>
