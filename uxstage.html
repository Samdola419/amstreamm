<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>UX stage</title><style>
html,body{margin:0;background:#050505;padding:4px}
#zoom{width:1308px;transform-origin:0 0;transform:scale(.605)}
iframe{border:1px solid #333;background:#000;display:block;flex:none;width:1280px;height:860px}
#mobt{margin:10px 0 2px;color:#888;font:600 11px system-ui}
#mobz{width:900px;transform-origin:0 0;transform:scale(.85);display:flex;gap:10px}
iframe.mob{width:392px;height:800px}
</style></head><body>
<div id="zoom"><iframe id="desk" src="/"></iframe></div>
<div id="mobt">MOBILE 392px — left: overlay mini · right: expanded sheet</div>
<div id="mobz">
  <iframe class="mob" id="mob1" src="/"></iframe>
  <iframe class="mob" id="mob2" src="/"></iframe>
</div>
<script>
const u=()=>'/'+'?r='+Math.random();
document.getElementById('desk').src=u();
document.getElementById('mob1').src=u();
document.getElementById('mob2').src=u();
</script>
</body></html>
